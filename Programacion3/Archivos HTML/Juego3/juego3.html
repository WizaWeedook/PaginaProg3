<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Taladro Espacial</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
    <style>
        body { margin: 0; }
        canvas { display: block; margin: 0 auto; }
    </style>
</head>
<body>
<script>
class GameScene extends Phaser.Scene {
    constructor() {
        super({ key: 'GameScene' });
    }

    preload() {
        // Usar los assets locales
        this.load.image('fondo', 'assets/fondo_espacial.gif'); // tu gif de fondo
        this.load.image('nave', 'assets/nave.png');
        this.load.image('taladro', 'assets/taladro.png');
        this.load.image('meteorito', 'assets/meteorito.png');
    }

    create() {
        // Fondo espacial
        this.add.image(400, 300, 'fondo').setDepth(-1).setDisplaySize(800, 600);

        // Crear nave
        this.nave = this.physics.add.sprite(400, 500, 'nave');
        this.nave.setCollideWorldBounds(true);

        // Crear taladro (punta)
        this.taladro = this.physics.add.sprite(this.nave.x, this.nave.y - 40, 'taladro');
        this.taladro.setScale(0.5);
        this.taladro.body.allowGravity = false;

        // Grupo de meteoritos
        this.meteoritos = this.physics.add.group();

        // Input
        this.cursors = this.input.keyboard.createCursorKeys();

        // Colisión taladro-meteorito
        this.physics.add.overlap(this.taladro, this.meteoritos, this.explotarMeteorito, null, this);

        // Timer para crear meteoritos
        this.time.addEvent({
            delay: 1000,
            callback: this.crearMeteorito,
            callbackScope: this,
            loop: true
        });
    }

    crearMeteorito() {
        const x = Phaser.Math.Between(50, 750);
        const meteorito = this.meteoritos.create(x, 0, 'meteorito');
        meteorito.setVelocityY(Phaser.Math.Between(100, 200));
        meteorito.setScale(0.5);
        meteorito.setCircle(32); // Ajusta según el sprite
    }

    explotarMeteorito(taladro, meteorito) {
        meteorito.destroy();
    }

    update() {
        // Movimiento de la nave
        const speed = 250;
        this.nave.setVelocity(0);

        if (this.cursors.left.isDown) {
            this.nave.setVelocityX(-speed);
        } else if (this.cursors.right.isDown) {
            this.nave.setVelocityX(speed);
        }
        if (this.cursors.up.isDown) {
            this.nave.setVelocityY(-speed);
        } else if (this.cursors.down.isDown) {
            this.nave.setVelocityY(speed);
        }

        // Posicionar el taladro en la punta de la nave
        this.taladro.x = this.nave.x;
        this.taladro.y = this.nave.y - 40;
    }
}

const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    backgroundColor: '#222',
    physics: {
        default: 'arcade',
        arcade: {
            debug: false
        }
    },
    scene: [GameScene]
};

const game = new Phaser.Game(config);
</script>
</body>
</html>
