<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Taladro Espacial</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            margin: 0;
            padding: 0;
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>
<script>
class GameScene extends Phaser.Scene {
    constructor() {
        super({ key: 'GameScene' });
        // Constantes
        this.VELOCIDAD_NAVE = 400;
        this.VIDAS_INICIALES = 3;
        this.METEORITOS_PASAR_GAMEOVER = 5;
    }

    preload() {
        // Usar los assets locales
        this.load.on('loaderror', (file) => {
            console.error('Error cargando:', file.src);
        });

        this.load.on('filecomplete', (key, type, data) => {
            console.log('Archivo cargado exitosamente:', key);
        });

        this.load.image('fondo', 'assets/Fondo Espacial.gif');
        this.load.image('nave', 'assets/nave.png');
        this.load.image('taladro', 'assets/taladro.png');
        this.load.image('meteorito', 'assets/meteorito.png');
    }

    create() {
        // Fondo espacial adaptado al tamaño de la pantalla
        this.fondo = this.add.image(this.scale.width / 2, this.scale.height / 2, 'fondo')
            .setDepth(-1)
            .setDisplaySize(this.scale.width, this.scale.height);

        // Estadísticas
        this.meteoritosDestruidos = 0;
        this.vidas = this.VIDAS_INICIALES;
        this.tiempoInicial = this.time.now;
        this.meteoritosPasados = 0;
        this.juegoTerminado = false;

        // Texto de estadísticas
        this.textoEstadisticas = this.add.text(20, 20, '', {
            fontSize: '28px',
            fill: '#fff',
            fontFamily: 'Arial',
            stroke: '#000',
            strokeThickness: 4
        }).setDepth(10);

        // Crear nave en la parte inferior central
        this.nave = this.physics.add.sprite(this.scale.width / 2, this.scale.height - 100, 'nave');
        this.nave.setScale(0.2);
        this.nave.setCollideWorldBounds(true);
        this.nave.setSize(800, 400);
        this.nave.setOffset(-280, 50);

        // Crear taladro (punta)
        this.taladro = this.physics.add.sprite(this.nave.x, this.nave.y - 50, 'taladro');
        this.taladro.setScale(1);
        this.taladro.body.allowGravity = false;
        this.taladro.setCollideWorldBounds(true);
        this.taladro.setSize(100, 100);
        this.taladro.setOffset(-80, -50);

        // Grupo de meteoritos
        this.meteoritos = this.physics.add.group();

        // Input
        this.cursors = this.input.keyboard.createCursorKeys();

        // Colisión taladro-meteorito
        this.physics.add.overlap(this.taladro, this.meteoritos, this.explotarMeteorito, null, this);
        // Colisión nave-meteorito
        this.physics.add.collider(this.nave, this.meteoritos, this.colisionNave, null, this);

        // Timer para crear meteoritos
        this.timerMeteoritos = this.time.addEvent({
            delay: 2000,
            callback: this.crearMeteorito,
            callbackScope: this,
            loop: true
        });

        // Redimensionar fondo y reposicionar nave/taladro al cambiar tamaño
        this.scale.on('resize', this.redimensionar, this);
    }

    crearMeteorito() {
        const x = Phaser.Math.Between(50, this.scale.width - 50);
        const meteorito = this.meteoritos.create(x, 0, 'meteorito');
        meteorito.setScale(0.15);
        meteorito.setVelocityY(Phaser.Math.Between(100, 200));
        meteorito.setSize(40, 40);
        meteorito.setOffset(10, 10);
    }

    redimensionar(gameSize) {
        // Ajustar fondo
        this.fondo.setDisplaySize(gameSize.width, gameSize.height);
        this.fondo.setPosition(gameSize.width / 2, gameSize.height / 2);
        // Reposicionar nave y taladro
        this.nave.setPosition(gameSize.width / 2, gameSize.height - 100);
        this.taladro.setPosition(this.nave.x, this.nave.y - 50);
    }

    actualizarEstadisticas() {
        const tiempoJugado = ((this.time.now - this.tiempoInicial) / 1000).toFixed(1);
        this.textoEstadisticas.setText(
            `Meteoritos destruidos: ${this.meteoritosDestruidos}\nVidas: ${this.vidas}\nTiempo: ${tiempoJugado}s\nMeteoritos que pasaron: ${this.meteoritosPasados}`
        );
    }

    explotarMeteorito(taladro, meteorito) {
        if (this.juegoTerminado) return;
        // Crear efecto de explosión
        const explosion = this.add.sprite(meteorito.x, meteorito.y, 'meteorito');
        explosion.setScale(0.2);
        explosion.setAlpha(0.8);
        this.tweens.add({
            targets: explosion,
            scale: 0.4,
            alpha: 0,
            duration: 200,
            onComplete: () => {
                explosion.destroy();
            }
        });
        meteorito.destroy();
        this.meteoritosDestruidos++;
    }

    colisionNave(nave, meteorito) {
        if (this.juegoTerminado) return;
        // Efecto de explosión en la nave y el meteorito
        const explosionNave = this.add.sprite(nave.x, nave.y, 'nave');
        explosionNave.setScale(0.2);
        explosionNave.setAlpha(0.8);
        this.tweens.add({
            targets: explosionNave,
            scale: 0.4,
            alpha: 0,
            duration: 200,
            onComplete: () => {
                explosionNave.destroy();
            }
        });
        const explosionMeteorito = this.add.sprite(meteorito.x, meteorito.y, 'meteorito');
        explosionMeteorito.setScale(0.2);
        explosionMeteorito.setAlpha(0.8);
        this.tweens.add({
            targets: explosionMeteorito,
            scale: 0.4,
            alpha: 0,
            duration: 200,
            onComplete: () => {
                explosionMeteorito.destroy();
            }
        });
        meteorito.destroy();
        this.vidas--;
        if (this.vidas <= 0) {
            this.gameOver();
        }
    }

    gameOver() {
        if (this.juegoTerminado) return;
        this.juegoTerminado = true;
        this.nave.destroy();
        this.taladro.destroy();
        this.physics.pause();
        if (this.timerMeteoritos) this.timerMeteoritos.remove(false);
        // Guardar estadísticas en localStorage
        const tiempoJugado = ((this.time.now - this.tiempoInicial) / 1000).toFixed(1);
        localStorage.setItem('estadisticas_juego3', JSON.stringify({
            meteoritosDestruidos: this.meteoritosDestruidos,
            vidas: this.vidas,
            tiempo: tiempoJugado,
            meteoritosPasados: this.meteoritosPasados
        }));
        // Redirigir a la pantalla de Game Over
        window.location.href = 'gameover3.html';
    }

    update() {
        if (this.juegoTerminado) return;
        // Movimiento de la nave
        this.nave.setVelocity(0);
        if (this.cursors.left.isDown) {
            this.nave.setVelocityX(-this.VELOCIDAD_NAVE);
        } else if (this.cursors.right.isDown) {
            this.nave.setVelocityX(this.VELOCIDAD_NAVE);
        }
        if (this.cursors.up.isDown) {
            this.nave.setVelocityY(-this.VELOCIDAD_NAVE);
        } else if (this.cursors.down.isDown) {
            this.nave.setVelocityY(this.VELOCIDAD_NAVE);
        }
        // Posicionar el taladro en la parte superior de la nave
        this.taladro.x = this.nave.x;
        this.taladro.y = this.nave.y - 50;

        // Revisar meteoritos que salen por la parte inferior de la pantalla
        this.meteoritos.getChildren().forEach((meteorito) => {
            if (meteorito.active && meteorito.y > this.scale.height) {
                meteorito.destroy();
                this.meteoritosPasados++;
                if (this.meteoritosPasados >= this.METEORITOS_PASAR_GAMEOVER) {
                    this.gameOver();
                }
            }
        });

        // Actualizar estadísticas
        this.actualizarEstadisticas();
    }
}

const config = {
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    backgroundColor: '#222',
    physics: {
        default: 'arcade',
        arcade: {
            debug: false
        }
    },
    scene: [GameScene],
    pixelArt: false,
    roundPixels: true,
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width: window.innerWidth,
        height: window.innerHeight
    }
};

// Asegurarse de que el juego se inicie después de que todo esté cargado
window.onload = function() {
    const game = new Phaser.Game(config);
    
    // Manejar el redimensionamiento de la ventana
    window.addEventListener('resize', function() {
        game.scale.resize(window.innerWidth, window.innerHeight);
    });
};
</script>
</body>
</html>
